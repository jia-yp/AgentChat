# Nginx Proxy Manager UI recipe (reference only; NPM generates the full config).
# Replace the placeholders: chat.example.com = public domain, <NAS_IP> = host running Docker Compose,
# <NPM_IP> / <NPM_HTTP_PORT> / <NPM_HTTPS_PORT> = Nginx Proxy Manager address and ports.
# Domain Names: chat.example.com
# Scheme: http; Forward Hostname/IP: <NAS_IP>; Forward Port: 8780
# SSL: certificate for chat.example.com; Force SSL: enabled
# Custom Locations: /agent-connect -> http://<NAS_IP>:8781
# In that custom location's Advanced field:
rewrite ^/agent-connect(?:/(.*))?$ /$1 break;

# In the host-level Settings / Custom Nginx Configuration field:
# Cloudflare Tunnel uses HTTPS to reach NPM even for browser HTTP requests.
if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
}

# Example Cloudflare Tunnel routing:
# *.example.com /^/\.well-known/acme-challenge/ -> http://<NPM_IP>:<NPM_HTTP_PORT>
# *.example.com (all other paths) -> https://<NPM_IP>:<NPM_HTTPS_PORT>
# TLS verification enabled; Match SNI to host enabled.
