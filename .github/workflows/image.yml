# Builds the server image, smoke-tests the NAS setup (single port, setup code
# in logs, running as the owner of /data), then publishes x86 and ARM images
# to GitHub Container Registry as ghcr.io/<owner>/<repo>.
name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: [Dockerfile, requirements.txt, compose.nas.yaml, server/**, bridge/**, skills/**, deploy/**, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentchat:test
          cache-from: type=gha

      - name: Smoke test
        run: |
          set -eu
          caps="--read-only --tmpfs /tmp --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID"
          env="-e AGENTCHAT_SINGLE_PORT=1 -e AGENTCHAT_LOG_SETUP_CODE=1"
          wait_up() { for i in $(seq 40); do curl -fsS "http://127.0.0.1:$1/healthz" >/dev/null && return 0; sleep 1; done; docker logs "$2"; return 1; }
          owner() { docker run --rm --entrypoint stat -v "$1:/d" agentchat:test -c %u:%g /d/agentchat.sqlite3; }

          # Named volume: runs as 568:568, single port, setup code in the logs.
          docker run -d --name named $caps $env -v agentchat-test:/data -p 18780:8781 agentchat:test
          wait_up 18780 named
          curl -fsS http://127.0.0.1:18780/api/status | grep -q '"single_port":true'
          curl -fsS http://127.0.0.1:18780/ | grep -q '<title>'
          docker logs named 2>&1 | grep -q '首次登录的初始化码'
          test "$(owner agentchat-test)" = "568:568"

          # Shared folder owned by another account: the server adopts that owner.
          mkdir -p "$RUNNER_TEMP/share" && sudo chown 1026:100 "$RUNNER_TEMP/share"
          docker run -d --name share $caps $env -v "$RUNNER_TEMP/share:/data" -p 18781:8781 agentchat:test
          wait_up 18781 share
          test "$(sudo stat -c %u:%g "$RUNNER_TEMP/share/agentchat.sqlite3")" = "1026:100"

          # Missing folder created by Docker as root: handed to 568:568.
          docker run -d --name fresh $caps $env -v "$RUNNER_TEMP/fresh:/data" -p 18782:8781 agentchat:test
          wait_up 18782 fresh
          test "$(sudo stat -c %u:%g "$RUNNER_TEMP/fresh/agentchat.sqlite3")" = "568:568"

          # Explicit user (the source compose file): entrypoint stays out of the way.
          mkdir -p "$RUNNER_TEMP/user" && sudo chown 1000:1000 "$RUNNER_TEMP/user"
          docker run -d --name user --user 1000:1000 --read-only --tmpfs /tmp --cap-drop ALL -v "$RUNNER_TEMP/user:/data" -p 18783:8781 agentchat:test
          wait_up 18783 user
          test "$(sudo stat -c %u:%g "$RUNNER_TEMP/user/agentchat.sqlite3")" = "1000:1000"

          docker rm -f named share fresh user

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
