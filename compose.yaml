services:
  api:
    build: .
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8781}:8781"
    environment:
      AGENTCHAT_SECURE_COOKIE: ${AGENTCHAT_SECURE_COOKIE:-0}
      AGENTCHAT_REGISTRATION_OPEN: ${AGENTCHAT_REGISTRATION_OPEN:-1}
      AGENTCHAT_ORIGINS: ${AGENTCHAT_ORIGINS:-}
      AGENTCHAT_PUBLIC_API_URL: ${AGENTCHAT_PUBLIC_API_URL:-}
    volumes:
      - ./data:/data
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8781/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8780}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
        restart: true
